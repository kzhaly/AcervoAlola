<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="icon" href="./imgs/icon.webp">
    <link rel="stylesheet" href="form.css">
    
</head>
<body>
    
        <div class="header">
            <img src="./imgs/headr.png" alt="Cabeçalho Acervo Alola">
        </div>

        <div class="menu">
            <hr>
        </div>

        <div class="colunas">
            <div class="coluna">
                <img src="imgs/coluna.png">

            </div>

            <div class="coluna2">
                <h2>Relate um problema!</h2>
                <form action="https://httpbin.org/post" method="post">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required> <br><br>
                    <label for="email">Email:  </label> 
                    <input type="email" id="email" name="email" required> <br><br>
                    <label for="assunto">Assunto:</label> 
                    <input type="text" id="assunto" name="assunto" required> <br><br>
                    <label for="detalhe">Fale mais sobre:</label> 
                    <textarea type="text" id="detalhe" name="detalhe"></textarea><br><br>
                    <button type="submit">Enviar</button>
                </form>
            </div>

            <div class="coluna">
                <img src="imgs/coluna.png">
            </div>
        </div>
        <div class="footer">
            <p style="color: rgb(152, 114, 74);"><a>Fale conosco!</p></a>
            <p style="color: rgb(152, 114, 74);"><a>Deixe seu Feedback</p></a>
            <p style="color: rgb(152, 114, 74);">&copy; 2026 Acervo Alola. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
